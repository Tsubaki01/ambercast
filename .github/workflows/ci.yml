name: ci

on:
  pull_request:

permissions: {}

jobs:
  agent-hooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm run test:agent-hooks

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor (engines.node) + latest, per the toolchain design decision.
        node-version: ['22.14', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first via the "pretest" script, so a separate
      # explicit build step here would just rebuild the same output twice.
      - run: npm test
      - run: node scripts/verify-pack.mjs

  lint:
    # Single Node version (the engines floor): architecture/determinism
    # guardrails aren't Node-version-sensitive, so running them once avoids
    # doubling lint time across the build-test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps

  contract-browser:
    # Separate lane, not folded into build-test: this suite needs a real
    # Chromium binary, which the default `npm test` run deliberately excludes
    # (see vitest.config.ts's test.exclude). A single Node version matches
    # the lint job's reasoning — the browser contract isn't sensitive to the
    # Node version matrix build-test exists to cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      # playwright-core (a direct dependency) ships the same browser-management
      # CLI as the `playwright` package, so no extra devDependency is needed
      # just to install the Chromium binary this lane requires.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:contract:browser
