name: ci

on:
  pull_request:

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor (engines.node) + latest, per the toolchain design decision.
        node-version: ['22.14', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first via the "pretest" script, so a separate
      # explicit build step here would just rebuild the same output twice.
      - run: npm test
      - run: node scripts/verify-pack.mjs

  lint:
    # Single Node version (the engines floor): architecture/determinism
    # guardrails aren't Node-version-sensitive, so running them once avoids
    # doubling lint time across the build-test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps
